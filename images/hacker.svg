<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="100%" height="100%" fill="#000"/>
  <!-- Simple "matrix"-like falling binary pattern -->
  <g fill="#00ff66" font-family="monospace" font-size="20">
    <defs>
      <pattern id="col" width="40" height="40" patternUnits="userSpaceOnUse">
        <text x="0" y="14">101001</text>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#col)" opacity="0.06"/>
    <!-- scattered larger lines -->
    <text x="40" y="120" opacity="0.18">0101011100110101</text>
    <text x="220" y="260" opacity="0.14">1101001010011100</text>
    <text x="480" y="420" opacity="0.12">0011010101010110</text>
    <text x="820" y="180" opacity="0.16">1001101010110001</text>
    <text x="1200" y="600" opacity="0.10">0110011101010101</text>
    <text x="1520" y="320" opacity="0.12">1010101010111001</text>
  </g>
</svg>
